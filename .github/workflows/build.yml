name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download libv2ray.aar
        run: |
          mkdir -p V2rayNG/app/libs
          curl -L -o V2rayNG/app/libs/libv2ray.aar $(curl -s https://github.com | grep "browser_download_url.*libv2ray.aar" | cut -d '"' -f 4)

      - name: Grant execute permission for gradlew
        working-directory: ./V2rayNG
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./V2rayNG
        run: ./gradlew assemblePlaystoreDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ruroa-debug-apk
          path: V2rayNG/app/build/outputs/apk/**/*.apk
